server {
    listen 80;
    listen [::]:80;
    server_name websitev2-uat.enkash.in;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
   
    client_max_body_size 20M;



    # location /resources {
    #     proxy_pass https://blogs.enkash.com;
    #     proxy_http_version 1.1;
    #     proxy_buffering off;
    #     proxy_read_timeout    90;
    #     proxy_connect_timeout 90;
    #     proxy_redirect        off;
    #     proxy_set_header Host blogs.enkash.com;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Port 443;
    #     proxy_set_header Proxy "";
    # }
    location /resources/ {

        proxy_pass https://blogs.enkash.com/blog/;

        proxy_http_version 1.1;

        proxy_set_header Host blogs.enkash.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;

        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }
  
    ## ✅ Main app route (Next.js SSR)


        # /resources -> /blog
    location = /resources {
        proxy_pass https://blogs.enkash.com/blog;
        proxy_http_version 1.1;
        proxy_set_header Host blogs.enkash.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /resources/blog/:path*
    location ^~ /resources/blog/ {
        rewrite ^/resources/blog/(.*)$ /blog/$1 break;

        proxy_pass https://blogs.enkash.com;
        proxy_http_version 1.1;
        proxy_set_header Host blogs.enkash.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /resources/:path*
    location ^~ /resources/ {
        rewrite ^/resources/(.*)$ /$1 break;

        proxy_pass https://blogs.enkash.com;
        proxy_http_version 1.1;
        proxy_set_header Host blogs.enkash.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

     
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
