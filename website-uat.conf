server {
    listen 80;
    listen [::]:80;
    server_name websitev2-uat.enkash.in;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    server_tokens off;
   
    client_max_body_size 50M;

