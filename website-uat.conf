server {
    listen 80;
    listen [::]:80;
    server_name websitev2-uat.enkash.in;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
   
    client_max_body_size 20M;

    ## ✅ Redirect rule
    rewrite ^/bolt/category/404/$ /products/vouchers/ permanent;
    rewrite ^/bolt/category/apparels/$ /apparels-vouchers/ permanent;
    rewrite ^/bolt/category/e-commerce/$ /e-commerce-vouchers/ permanent;
   
rewrite ^/bolt/category/food-and-beverages$ /food-and-beverages-vouchers permanent;
rewrite ^/bolt/category/health-and-wellness$ /health-and-wellness-vouchers permanent;
rewrite ^/bolt/category/movies-and-music$ /movie-and-music-vouchers permanent;
rewrite ^/bolt/voucher/404$ /products/vouchers permanent;
rewrite ^/bolt/voucher/BookMyShow-E-Gift-Card$ /products/vouchers permanent;
rewrite ^/corporate-cards/digital-marketing-cards$ /digital-marketing-card permanent;
rewrite ^/corporate-cards/diy-card-module$ /diy-card-module permanent;
rewrite ^/corporate-cards/fuel-cards$ /fuel-card permanent;
rewrite ^/corporate-cards/meal-cards$ /meal-card permanent;
rewrite ^/corporate-cards/purchase-cards$ /purchase-card permanent;
rewrite ^/corporate-cards/saas-cards$ /saas-card permanent;
rewrite ^/corporate-cards/travel-and-expense-cards$ /travel-and-expense-card permanent;
rewrite ^/corporate-cards/virtual-cards$ /virtual-card permanent;
rewrite ^/loyalty-lounge/brand-voucher$ /products/vouchers permanent;
rewrite ^/loyalty-lounge/channel-incentive$ /channel-incentives permanent;
rewrite ^/loyalty-lounge/employee-rewards$ /employee-rewards permanent;
rewrite ^/loyalty-lounge/gift-cards$ /gift-cards permanent;
rewrite ^/loyalty-lounge/offers$ /offers permanent;
rewrite ^/ofex/budget-and-advances$ /budget-and-advances permanent;
rewrite ^/ofex/hierarchy-and-controls$ /hierarchy-and-controls permanent;
rewrite ^/ofex/insights$ /expense-analytics-and-insights permanent;
rewrite ^/ofex/policy-and-approval-flows$ /approval-flows permanent;
rewrite ^/ofex/reimbursement$ /reimbursements permanent;
rewrite ^/ofex/scan-and-drop-receipts$ /receipts permanent;
rewrite ^/olympus/payables$ /products/make-payments permanent;
rewrite ^/olympus/payables/bill-payment$ /utility-bill-payment permanent;
rewrite ^/olympus/payables/bulk-payout$ /bulk-pay permanent;
rewrite ^/olympus/payables/gst-payments$ /gst-payment permanent;
rewrite ^/olympus/payables/invoice-management$ /invoice-management permanent;
rewrite ^/olympus/payables/payable-analytics$ /payable-analytics permanent;
rewrite ^/olympus/payables/payroll-processing$ /payroll permanent;
rewrite ^/olympus/payables/rental-payment$ /rent-payment permanent;
rewrite ^/olympus/payables/seamless-banking$ /connected-banking permanent;
rewrite ^/olympus/payables/vendor-management$ /vendor-management permanent;
rewrite ^/olympus/payables/vendor-payment$ /vendor-payment permanent;
rewrite ^/olympus/receivables$ /products/collect-payments permanent;
rewrite ^/olympus/receivables/auto-collect$ /auto-collect permanent;
rewrite ^/olympus/receivables/automated-reconciliation$ /auto-reconciliation permanent;
rewrite ^/olympus/receivables/bulk-collect$ /bulk-collect permanent;
rewrite ^/olympus/receivables/collection-analytics$ /collection-analytics permanent;
rewrite ^/olympus/receivables/customized-payment$ /payment-page permanent;
rewrite ^/olympus/receivables/e-nach$ /e-nach permanent;
rewrite ^/olympus/receivables/instant-settlements$ /instant-settlement permanent;
rewrite ^/olympus/receivables/invoices$ /digital-invoicing permanent;
rewrite ^/olympus/receivables/payment-button$ /payment-button permanent;
rewrite ^/olympus/receivables/payment-gateway$ /payment-gateway permanent;
rewrite ^/olympus/receivables/payment-links$ /payment-links permanent;
rewrite ^/olympus/receivables/qr-codes$ /qr-code permanent;
rewrite ^/olympus/receivables/reminder-engine$ /collection-reminder permanent;
rewrite ^/olympus/receivables/subscription-management$ /subscriptions permanent;
rewrite ^/olympus/receivables/upi-payments$ /upi-payments permanent;
rewrite ^/olympus/receivables/virtual-accounts$ / permanent;
rewrite ^/policies/payments$ /policies permanent;
rewrite ^/policies/platform$ /policies permanent;
rewrite ^/policies/prepaid-program$ /policies permanent;
rewrite ^/policies/privacy-policy$ /policies/privacy-policy permanent;


## ✅ Solutions redirects
rewrite ^/solutions/apis-modules$ / permanent;
rewrite ^/solutions/cashflow-analytics$ / permanent;
rewrite ^/solutions/cfo-insights$ / permanent;
rewrite ^/solutions/cfo-suite$ / permanent;
rewrite ^/solutions/customized-reporting$ / permanent;
rewrite ^/solutions/instant-card-management$ /instant-card-management permanent;
rewrite ^/solutions/integrations$ https://docs.enkash.com/ permanent;
rewrite ^/solutions/workflow-management$ /workflow-management permanent;

## ✅ Vouchers redirects
rewrite ^/voucher/zee5$ /vouchers/zee5 permanent;
rewrite ^/vouchers/category/apparels$ /apparels-vouchers permanent;
rewrite ^/vouchers/category/e-commerce$ /e-commerce-vouchers permanent;
rewrite ^/vouchers/category/food-and-beverages$ /food-and-beverages-vouchers permanent;
rewrite ^/vouchers/category/health-and-wellness$ /health-and-wellness-vouchers permanent;
rewrite ^/vouchers/category/movies-and-music$ /movie-and-music-vouchers permanent;
rewrite ^/vouchers/movies-and-music/zee5-gift-card$ /vouchers/zee5 permanent;

    location /resources {
        proxy_pass https://blogs.enkash.com;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout    90;
        proxy_connect_timeout 90;
        proxy_redirect        off;
        proxy_set_header Host blogs.enkash.com;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Proxy "";
    }
  
    ## ✅ Main app route (Next.js SSR)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
