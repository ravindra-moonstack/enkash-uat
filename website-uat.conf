server {
    listen 80;
    listen [::]:80;
    server_name websitev2-uat.enkash.in;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain text/css text/xml
        text/javascript application/x-javascript
        application/xml application/javascript
        application/json
        font/eot font/otf font/ttf
        image/svg+xml;
    gzip_disable "MSIE [1-6]\\.";

    absolute_redirect off;
    client_max_body_size 20M;

    ## --- Do NOT add rewrite for trailing slash like below ---
    ## It breaks Next.js dynamic routes like `/about`, `/login`, etc.
    # rewrite ^([^.]*[^/])$ $1/ permanent;

    ## ✅ Static file handling for Next.js
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ## ✅ Blog Resources Proxy
    location = /resources/ {
        proxy_pass https://blogs.enkash.com/blog/;
        proxy_set_header Host blogs.enkash.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Proxy "";
    }

    location /resources/ {
        proxy_pass https://blogs.enkash.com/;
        proxy_set_header Host blogs.enkash.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Proxy "";
    }

    ## Redirect `/resource` to `/resources/`
    location = /resource {
        return 301 /resources/;
    }

    ## ✅ Main app route (Next.js SSR)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ## Optional: Redirect /resource-video to /resources/videos/
    location /resource-video {
        rewrite ^/resource-video(.*)$ /resources/videos/$1 redirect;
    }

    ## You can uncomment these later if needed
    # location ~ ^/bolt/category/([^/?]+)/?$ {
    #     rewrite ^/bolt/category/(.*)$ /voucher/category/$1 permanent;
    # }
}
