server {
    listen 80;
    listen [::]:80;
    server_name enkash.com;

    return 301 https://www.enkash.com$request_uri;
}

server {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
     gzip_types
      text/plain text/css text/xml
      text/javascript application/x-javascript
      application/xml application/javascript
      application/json
      font/eot
      font/otf
      font/ttf
      image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
    listen 80;
    listen [::]:80;
    server_name www.enkash.com;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 20M;
    

    # location /admin {
    #     deny all;
    #     return 403;
    # } 
    location / {
        proxy_pass http://127.0.0.1:3000; 
        proxy_hide_header x-nextjs-prerender;
        proxy_hide_header x-nextjs-stale-time;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Security headers are managed by Next.js application (next.config.ts)
    }


}

